buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '4.1.16', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above lines are required for ForgeGradle.
apply plugin: 'java'

version = '5.1.0-beta.9.3-1.16.5'
group = 'dev.quantumfusion.dashloader'
archivesBaseName = 'dashloader-forge-1.16.5'

// Forge 1.16.5 targets Java 8. Gradle itself must run on Java 8-16
// (see gradle.properties: org.gradle.java.home), NOT on Java 17+.
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    // NOTE (2026-09-24 spike): 'official' (Mojang) names would be closest to
    // modern yarn/mojmap, but the official mapping pipeline for 1.16.5 does
    // not complete in this environment (a previous attempt also left only a
    // .pom with no mapped jar in minecraft_user_repo). snapshot_20210309 is
    // fully cached and proven to work here, so the skeleton uses MCP names.
    // Revisit official_1.16.5 if the pipeline issue is ever diagnosed.
    //   mappings channel: 'official', version: '1.16.5'
    mappings channel: 'snapshot', version: '20210309-1.16.5'

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods {
                dashloader {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods {
                dashloader {
                    source sourceSets.main
                }
            }
        }
    }
}

// Example: add a dependency (Jei, Patchouli, ...) if the vertical slice needs one.
// dependencies {
//     minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'
// }
dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'

    // SpongePowered Mixin: Forge 1.16.5 ships Mixin 0.8.2 at runtime, so
    // compileOnly is enough. The AP is DELIBERATELY absent: it validates
    // @Accessor/@Shadow targets against MCP (dev) names, but without a refmap
    // pipeline all string references must be SRG names for production.
    // Validation happens at runtime (Forge logs precisely).
    compileOnly 'org.spongepowered:mixin:0.8.2'
    // Gson ships on the 1.16.5 runtime classpath (vanilla uses it); the cache
    // backend (CacheGson/DashCacheBackend) serializes module Data POJOs with
    // it, so compileOnly is enough — nothing is bundled into the mod jar.
    compileOnly 'com.google.code.gson:gson:2.8.0'
    // Mixin's annotation processor needs Gson on the processor path
    // (its pom does not carry it transitively here). 2.8.0 matches MC 1.16.5.
    annotationProcessor 'com.google.code.gson:gson:2.8.0'
    // Same for Guava (Mixin AP uses com.google.common.collect.Maps).
    // 21.0 matches MC 1.16.5.
    annotationProcessor 'com.google.guava:guava:21.0'
    // Same for Log4j (Mixin AP uses LogManager). 2.11.1 matches MC 1.16.5.
    annotationProcessor 'org.apache.logging.log4j:log4j-api:2.11.1'
    annotationProcessor 'org.apache.logging.log4j:log4j-core:2.11.1'
    // Same for ASM (Mixin AP parses target classes). 7.2 matches MC 1.16.5.
    annotationProcessor 'org.ow2.asm:asm:7.2'
    annotationProcessor 'org.ow2.asm:asm-tree:7.2'
    annotationProcessor 'org.ow2.asm:asm-analysis:7.2'
    annotationProcessor 'org.ow2.asm:asm-commons:7.2'
    annotationProcessor 'org.ow2.asm:asm-util:7.2'
}

repositories {
    // SpongePowered maven (mixin artifacts). Forge/Minecraft repos are
    // added automatically by ForgeGradle — do NOT add them here.
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

// Example configuration to allow publishing using the maven-publish task.
// This is an example of using the maven-publish plugin to publish your mod to a
// maven repository. It is not required, and you can remove this block if you
// do not intend to publish.
// https://docs.gradle.org/current/userguide/publishing_maven.html
// tasks.withType(PublishToMavenLocal).configureEach {
//     dependsOn 'reobfJar'
// }

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.16.5'

    // replace stuff in mods.toml / pack.mcmeta, nothing else.
    // NOTE: filesMatching needs one pattern per call (a List arg matches nothing).
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version, 'mcversion': '1.16.5'
    }
    filesMatching('pack.mcmeta') {
        expand 'version': project.version, 'mcversion': '1.16.5'
    }
}

// Mixin refmap plumbing WITHOUT MixinGradle (unresolvable in 2026: gone
// from Sponge maven, absent from Central and the plugin portal).
// Two adaptations are needed for Mixin 0.8.2's annotation processor
// (verified by disassembling MappingProviderSrg$1 / ObfuscationServiceMCP):
//  1. Its MCP service only knows the option names reobfSrgFile/outSrgFile/
//     outRefMapFile/defaultObfuscationEnv (no inMapFileSrg/defaultRefmapJson).
//  2. Its MappingProviderSrg only parses old SRG format (PK:/CL:/FD:/MD:
//     prefixes; MappingMethod(MCPname, MCPdesc) -> (SRGname, SRGdesc)),
//     while FG 4.1 emits prefix-less TSRG — so convertTsrgToSrg translates
//     FG's output (MCP side first, matching the provider's key direction).
task convertTsrgToSrg {
    dependsOn 'createMcpToSrg'
    inputs.file file('build/createMcpToSrg/output.tsrg')
    outputs.file file('build/mixin/in.srg')
    doLast {
        def out = file('build/mixin/in.srg')
        out.parentFile.mkdirs()
        def ownerMcp = null
        def ownerSrg = null
        out.withWriter { w ->
            file('build/createMcpToSrg/output.tsrg').eachLine { line ->
                if (!line.trim() || line.startsWith('#')) return
                if (!line.startsWith('\t') && !line.startsWith(' ')) {
                    def p = line.split(' ')
                    ownerMcp = p[0]
                    ownerSrg = p[1]
                    w.writeLine("CL: ${ownerMcp} ${ownerSrg}")
                } else {
                    def p = line.trim().split(' ')
                    if (p.length == 2) {
                        w.writeLine("FD: ${ownerMcp}/${p[0]} ${ownerSrg}/${p[1]}")
                    } else if (p.length == 3) {
                        w.writeLine("MD: ${p[0]} ${p[1]} ${p[2]} ${p[1]}")
                    }
                }
            }
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    // Mapping data is generated by FG tasks — ensure they run first.
    dependsOn 'convertTsrgToSrg', 'createSrgToMcp'
    doFirst {
        mkdir 'build/mixin'
    }
    options.compilerArgs += [
        '-AreobfSrgFile=' + file('build/mixin/in.srg').absolutePath,
        '-AoutSrgFile=' + file('build/mixin/out.srg').absolutePath,
        '-AoutRefMapFile=' + file('build/mixin/dashloader-1.16.5-refmap.json').absolutePath,
        '-AdefaultObfuscationEnv=searge',
        // Validate searge only: Forge 1.16.5 production uses SRG names, and
        // there is no notch input (default would validate both and fail).
        '-AmappingTypes=searge'
    ]
}

// Example configuration to allow publishing using the maven-publish task
jar {
    // the manifest is read by ForgeGradle; the 'Automatic-Module-Name' etc.
    // entries below follow the 1.16.5 MDK defaults.
    manifest {
        attributes([
            'Specification-Title'     : 'dashloader',
            'Specification-Vendor'    : 'quantumfusion',
            'Specification-Version'   : '1', // We are version 1 of ourselves
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'quantumfusion',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            // WIP slice: declares the mixin config to Forge. A production
            // build additionally needs a refmap (MixinGradle) — pending.
            'MixinConfigs'            : 'dashloader-1.16.5.mixins.json'
        ])
    }
    // Reobfuscation is handled by the 'reobfJar' task; include it in archives.
    finalizedBy 'reobfJar'
}
